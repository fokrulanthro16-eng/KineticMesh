name: KineticMesh CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-consensus-tests:
    name: Backend Consensus & Invariant Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Mathematical & Consensus Unit Tests
        run: |
          cd backend
          python test_consensus.py

      - name: Run Full Reactive Defense E2E Verification
        run: |
          cd backend
          # Start FastAPI consensus engine in background
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 4
          # Execute 5-stage automated attack verification suite
          python e2e_attack_verification.py

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Next.js 15 Production Build
        run: |
          cd frontend
          npm run build
