version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kineticmesh-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "14550:14550/udp"
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - kineticmesh-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kineticmesh-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/telemetry
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kineticmesh-net

networks:
  kineticmesh-net:
    driver: bridge
